<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Inventory - Products</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
	font-family: Arial, sans-serif;
	margin: 20px;
}

h1 {
	color: #333;
}

table {
	width: 100%;
	border-collapse: collapse;
	margin-top: 20px;
}

th, td {
	border: 1px solid #ccc;
	padding: 8px;
	text-align: left;
}

th {
	background-color: #f4f4f4;
}

input, textarea, button {
	padding: 6px;
	margin: 4px;
}

input[type="number"] {
	width: 120px;
}

.form-container {
	background: #f9f9f9;
	padding: 15px;
	border-radius: 6px;
	width: 50%;
}

button {
	cursor: pointer;
}

.delete-btn {
	background: #e74c3c;
	color: white;
	border: none;
	border-radius: 4px;
}

.add-btn {
	background: #2ecc71;
	color: white;
	border: none;
	border-radius: 4px;
}

.pagination {
	text-align: center;
	margin-top: 20px;
}

.pagination button {
	padding: 8px 14px;
	margin: 0 5px;
	border: none;
	border-radius: 4px;
	cursor: pointer;
}

.pagination button:disabled {
	background-color: #ccc;
	cursor: not-allowed;
}

.pagination span {
	font-weight: bold;
	margin: 0 10px;
}
</style>
</head>
<body>

	<h1>📦 Smart Inventory - Product Management</h1>

	<div style="margin-bottom: 20px;">
		<a href="categories.html">
			<button
				style="background: #3498db; color: white; border: none; border-radius: 4px; padding: 8px 12px; cursor: pointer;">
				View Categories</button>
		</a>
	</div>

	<!-- Add product form -->
	<div class="form-container">
		<h3>Add New Product</h3>
		<div>
			<input id="productTitle" placeholder="Product Title" /> <select
				id="productCategoryId">
				<option value="">Select Category</option>
			</select>
		</div>
		<div>
			<textarea id="productDesc" placeholder="Product Description" rows="2"
				cols="40"></textarea>
		</div>
		<div>
			<input id="price" type="number" placeholder="Price" step="0.01" /> <input
				id="stockQuantity" type="number" placeholder="Stock Quantity" />
		</div>
		<button id="btnAdd" class="add-btn">Add Product</button>
	</div>

	<!-- Product list -->
	<table id="productTable">
		<thead>
			<tr>
				<th>ID</th>
				<th>Title</th>
				<th>Description</th>
				<th>Category</th>
				<th>Price</th>
				<th>Stock Qty</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody></tbody>
	</table>

	<!-- Pagination controls -->
	<div class="pagination">
		<button id="prevBtn">Previous</button>
		<span id="pageInfo"></span>
		<button id="nextBtn">Next</button>
	</div>

	<script>
    const BASE = window.location.origin + "/products";
    let currentPage = 0;
    const pageSize = 5;
    let totalPages = 0;

    //Fetch paginated products
    async function fetchProducts(page = 0) {
      try {
        const res = await fetch(`${BASE}/getProductByPagination/${page}/${pageSize}`);
        if (!res.ok) throw new Error("Failed to fetch products");
        const data = await res.json();
        renderProducts(data.content); // content array
        updatePagination(data);
      } catch (err) {
        console.error(err);
        alert("Error fetching products.");
      }
    }

    // Update pagination controls
    function updatePagination(data) {
      currentPage = data.number; // current page number
      totalPages = data.totalPages; // total pages
      document.getElementById("pageInfo").textContent = `Page ${currentPage + 1} of ${totalPages}`;
      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = data.last; // last page
    }
    // Render table rows
    function renderProducts(products) {
      const tbody = document.querySelector("#productTable tbody");
      tbody.innerHTML = "";

      if (!products.length) {
        tbody.innerHTML = "<tr><td colspan='7'>No products found</td></tr>";
        return;
      }

      products.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.id}</td>
          <td>${escapeHtml(p.productTitle)}</td>
          <td>${escapeHtml(p.productDesc)}</td>
          <td>${escapeHtml(p.category?.name || "")}</td>
          <td>${p.price.toFixed(2)}</td>
          <td>${p.stockQuantity}</td>
          <td><button class="delete-btn" data-id="${p.id}">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });

      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", async e => {
          const id = e.target.dataset.id;
          if (!confirm("Delete product ID " + id + "?")) return;

          try {
            const del = await fetch(BASE + "/deleteProduct/" + id, { method: "DELETE" });
            if (!del.ok) throw new Error("Delete failed");
            alert("Product deleted successfully!");
            fetchProducts(currentPage); // stay on same page
          } catch (err) {
            console.error(err);
            alert("Error deleting product.");
          }
        });
      });
    }

    

    // Escape HTML for safety
    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[s]));
    }
    
    //fetch categories
    async function fetchCategoriesForDropdown() {
  try {
    const res = await fetch(window.location.origin + "/categories/getAllCategories");
    if (!res.ok) throw new Error("Failed to fetch categories");
    const categories = await res.json();

    const select = document.getElementById("productCategoryId");
    select.innerHTML = '<option value="">Select Category</option>';
    categories.forEach(c => {
      const option = document.createElement("option");
      option.value = c.id; // send this as categoryId
      option.textContent = c.name;
      select.appendChild(option);
    });
  } catch (err) {
    console.error(err);
    alert("Error fetching categories for dropdown.");
  }
}





    // Add new product
    document.getElementById("btnAdd").addEventListener("click", async () => {
  const productTitle = document.getElementById("productTitle").value.trim();
  const productDesc = document.getElementById("productDesc").value.trim();
  const categoryId = parseInt(document.getElementById("productCategoryId").value);
  const price = parseFloat(document.getElementById("price").value);
  const stockQuantity = parseInt(document.getElementById("stockQuantity").value);

  if (!productTitle || isNaN(categoryId) || isNaN(price) || isNaN(stockQuantity)) {
    alert("Please fill all required fields.");
    return;
  }

  const newProduct = {
    productTitle,
    productDesc,
    price,
    stockQuantity,
    category: { id: categoryId } 
  };

  try {
    const res = await fetch(window.location.origin + "/products/addProduct", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(newProduct)
    });
    if (!res.ok) throw new Error("Failed to add product");
    alert("Product added successfully!");
    document.querySelectorAll("input, textarea, select").forEach(el => el.value = "");
    fetchProducts(currentPage);
  } catch (err) {
    console.error(err);
    alert("Error adding product.");
  }
});


    // Pagination button events
    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentPage > 0) fetchProducts(currentPage - 1);
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentPage < totalPages - 1) fetchProducts(currentPage + 1);
    });

    // Initial load
    fetchProducts();
    fetchCategoriesForDropdown();
  </script>
</body>
</html>
