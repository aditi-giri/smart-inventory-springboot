<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Inventory - Categories</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
	font-family: Arial, sans-serif;
	margin: 20px;
}

h1 {
	color: #333;
}

table {
	width: 100%;
	border-collapse: collapse;
	margin-top: 20px;
}

th, td {
	border: 1px solid #ccc;
	padding: 8px;
	text-align: left;
}

th {
	background-color: #f4f4f4;
}

input, button {
	padding: 6px;
	margin: 4px;
}

.form-container {
	background: #f9f9f9;
	padding: 15px;
	border-radius: 6px;
	width: 50%;
}

button {
	cursor: pointer;
}

.add-btn {
	background: #2ecc71;
	color: white;
	border: none;
	border-radius: 4px;
}
</style>
</head>
<body>

	<h1>📁 Smart Inventory - Categories</h1>
	<a href="index.html">← Back to Products</a>

	<!-- Add category form -->
	<div class="form-container">
		<h3>Add New Category</h3>
		<input id="categoryName" placeholder="Category Name" />
		<button id="btnAddCategory" class="add-btn">Add Category</button>
	</div>

	<!-- Categories table -->
	<table id="categoryTable">
		<thead>
			<tr>
				<th>ID</th>
				<th>Category Name</th>
			</tr>
		</thead>
		<tbody></tbody>
	</table>


	<h2>Products in Selected Category</h2>
	<table id="productsByCategoryTable">
		<thead>
			<tr>
				<th>ID</th>
				<th>Title</th>
				<th>Description</th>
				
			</tr>
		</thead>
		<tbody></tbody>
	</table>

	<script>
    const BASE = window.location.origin + "/categories";

    // Fetch all categories
    async function fetchCategories() {
      try {
        const res = await fetch(BASE + "/getAllCategories");
        if (!res.ok) throw new Error("Failed to fetch categories");
        const data = await res.json();
        renderCategories(data);
      } catch (err) {
        console.error(err);
        alert("Error fetching categories.");
      }
    }

    // Render table
    function renderCategories(categories) {
      const tbody = document.querySelector("#categoryTable tbody");
      tbody.innerHTML = "";

      if (!categories.length) {
        tbody.innerHTML = "<tr><td colspan='2'>No categories found</td></tr>";
        return;
      }

      categories.forEach(c => {
    	  const tr = document.createElement("tr");
    	  tr.innerHTML = `
    	    <td>${c.id}</td>
    	    <td>${escapeHtml(c.name)}</td>
    	    <td><button onclick="fetchProductsByCategory(${c.id})" style="background:#3498db;color:white;border:none;border-radius:4px;padding:4px 8px;cursor:pointer;">View Products</button></td>
    	  `;
    	  tbody.appendChild(tr);
    	});

    }
    
    async function fetchProductsByCategory(categoryId) {
    	  try {
    	    const res = await fetch(`${BASE}/${categoryId}/products`);
    	    if (!res.ok) throw new Error("Failed to fetch products");
    	    const products = await res.json();
    	    renderProductsByCategory(products);
    	  } catch (err) {
    	    console.error(err);
    	    alert("Error fetching products for this category.");
    	  }
    	}

    	function renderProductsByCategory(products) {
    	  const tbody = document.querySelector("#productsByCategoryTable tbody");
    	  tbody.innerHTML = "";
    	  if (!products.length) {
    	    tbody.innerHTML = "<tr><td colspan='5'>No products found in this category</td></tr>";
    	    return;
    	  }
    	  products.forEach(p => {
    	    const tr = document.createElement("tr");
    	    tr.innerHTML = `
    	      <td>${p.id}</td>
    	      <td>${escapeHtml(p.productTitle)}</td>
    	      <td>${escapeHtml(p.productDesc)}</td>
    	      
    	    `;
    	    tbody.appendChild(tr);
    	  });
    	}


    // Escape HTML
    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[s]));
    }

    // Add new category
    document.getElementById("btnAddCategory").addEventListener("click", async () => {
      const categoryName = document.getElementById("categoryName").value.trim();
      if (!categoryName) {
        alert("Enter a category name.");
        return;
      }

      try {
        const res = await fetch(BASE + "/addCategory", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: categoryName })
        });
        if (!res.ok) throw new Error("Failed to add category");
        alert("Category added successfully!");
        document.getElementById("categoryName").value = "";
        fetchCategories();
      } catch (err) {
        console.error(err);
        alert("Error adding category.");
      }
    });
    
    

    // Initial load
    fetchCategories();
  </script>

</body>
</html>
